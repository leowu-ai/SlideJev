[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slidejev"
version = "0.1.0"
description = "Inference and evaluation for whole-slide candidate verification"
requires-python = ">=3.10"

[project.optional-dependencies]
inference = ["numpy>=1.24,<2", "safetensors>=0.4", "transformers==4.42.4", "torch>=2.4"]

[tool.setuptools]
packages = ["slidejev"]
